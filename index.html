<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>VegPro 3D Plant Viewer</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{
    margin:0;
    overflow:hidden;
    font-family:Arial, sans-serif;
    background:#eef3ef;
}
#info{
    position:absolute;
    top:20px;
    left:20px;
    z-index:2;
    width:280px;
    background:white;
    padding:20px;
    border-radius:12px;
    box-shadow:0 10px 30px rgba(0,0,0,.2);
}
#title{
    font-size:24px;
    font-weight:bold;
    margin-bottom:10px;
}
canvas{
    display:block;
}
</style>
</head>
<body>

<div id="info">
  <div id="title">Plant Viewer</div>
  <div id="text">
    Click any section of the plant.<br><br>
    <strong>Flower (top)</strong> → pests + count<br>
    <strong>Middle / lower</strong> → diseases severity 1–3
  </div>
</div>

<script type="module">
import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';
import { OrbitControls } from 'https://unpkg.com/three@0.160.0/examples/jsm/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xeaf5ea);

const camera = new THREE.PerspectiveCamera(
  45,
  window.innerWidth / window.innerHeight,
  0.1,
  1000
);
camera.position.set(5, 5, 8);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

const light = new THREE.DirectionalLight(0xffffff, 2);
light.position.set(10, 10, 10);
scene.add(light);
scene.add(new THREE.AmbientLight(0xffffff, 1));

const plant = new THREE.Group();
scene.add(plant);

function tag(mesh, zone) {
  mesh.name = zone;
  mesh.userData.zone = zone;
  return mesh;
}

const stem = tag(
  new THREE.Mesh(
    new THREE.CylinderGeometry(0.08, 0.08, 4),
    new THREE.MeshStandardMaterial({ color: 0x2e8b57 })
  ),
  'middle'
);
stem.position.y = 0;
plant.add(stem);

function leaf(y, rot, zone) {
  const geo = new THREE.SphereGeometry(0.35, 20, 20);
  const mat = new THREE.MeshStandardMaterial({ color: 0x39b54a });
  const l = new THREE.Mesh(geo, mat);
  l.scale.set(1.8, 0.4, 0.8);
  l.position.y = y;
  l.rotation.z = Math.PI / 2;
  l.rotation.y = rot;
  return tag(l, zone);
}

plant.add(leaf(-1.0, 0, 'lower'));
plant.add(leaf(-0.5, 1.4, 'lower'));
plant.add(leaf(0.4, -1.4, 'middle'));
plant.add(leaf(0.8, 0, 'middle'));

const flower = tag(
  new THREE.Mesh(
    new THREE.SphereGeometry(0.45, 32, 32),
    new THREE.MeshStandardMaterial({ color: 0xff5fa2 })
  ),
  'top'
);
flower.position.y = 2.3;
plant.add(flower);

const middle = tag(
  new THREE.Mesh(
    new THREE.CylinderGeometry(0.5, 0.5, 1.4),
    new THREE.MeshStandardMaterial({ transparent: true, opacity: 0.2, color: 0x00ff00 })
  ),
  'middle'
);
middle.position.y = 0.5;
plant.add(middle);

const lower = tag(
  new THREE.Mesh(
    new THREE.CylinderGeometry(0.55, 0.55, 1.4),
    new THREE.MeshStandardMaterial({ transparent: true, opacity: 0.2, color: 0x8B4513 })
  ),
  'lower'
);
lower.position.y = -1.3;
plant.add(lower);

const zoneCopy = {
  top: `<h2>TOP — Pests</h2>Flower zone<br><br>• Pick pest type<br>• Enter count (not severity)<br>• Thrips, Aphids, Whiteflies…`,
  middle: `<h2>MIDDLE — Disease</h2>Leaves &amp; stem<br><br>• Severity 1–3 only<br>• Powdery Mildew, Botrytis…`,
  lower: `<h2>LOWER — Disease</h2>Root zone<br><br>• Severity 1–3 only<br>• Root Rot, Stem Bot…`,
};

const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
let pointerDown = null;

window.addEventListener('pointerdown', (event) => {
  pointerDown = { x: event.clientX, y: event.clientY };
});

window.addEventListener('pointerup', (event) => {
  if (!pointerDown) return;
  const dx = event.clientX - pointerDown.x;
  const dy = event.clientY - pointerDown.y;
  pointerDown = null;
  if (Math.hypot(dx, dy) > 8) return;

  mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);

  // FIX: recursive true — leaves previously blocked transparent zone cylinders
  const hits = raycaster.intersectObjects(plant.children, true);
  const hit = hits.find((h) => h.object.userData.zone);
  if (!hit) return;

  const zone = hit.object.userData.zone;
  const text = document.getElementById('text');
  if (text) text.innerHTML = zoneCopy[zone] || 'Unknown zone';
});

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
